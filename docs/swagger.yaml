host: 127.0.0.1:8080
info:
  contact:
    name: API Support
    url: https://github.com/wyuneed/go-agent-api/issues
  description: Production-ready AI Agent API with DDD architecture and Eino workflow
    engine. Supports OpenAI-compatible tool calling, human-in-the-loop approval, JWT
    authentication, and streaming responses.
  license:
    name: MIT
    url: https://github.com/wyuneed/go-agent-api/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: Go Agent API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns 200 OK when the server process is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerHealthResponse'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      description: Returns 200 OK when the server is ready (DB + Redis connected)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerHealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      summary: Readiness check
      tags:
      - health
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT access + refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      summary: Login
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Uses a valid refresh token to issue a new access token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email and password
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerRegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: Sends messages to the AI agent and returns a completion. Set stream=true
        to receive Server-Sent Events.
      parameters:
      - description: Chat completion request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.ChatCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerChatCompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat completions (OpenAI-compatible)
      tags:
      - chat
  /v1/conversations:
    get:
      description: Returns all conversations belonging to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerConversationListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Creates a new conversation and sends the first message to the agent
      parameters:
      - description: Conversation details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerSendMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a conversation
      tags:
      - conversations
  /v1/conversations/{id}:
    get:
      description: Returns a conversation with its full message history
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a conversation
      tags:
      - conversations
  /v1/conversations/{id}/approve:
    post:
      consumes:
      - application/json
      description: Resumes a conversation that is paused waiting for human-in-the-loop
        approval
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Approval decision
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.ApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerApprovalResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject a pending action
      tags:
      - conversations
  /v1/conversations/{id}/messages:
    post:
      consumes:
      - application/json
      description: Sends a message to an existing conversation and returns the agent's
        reply
      parameters:
      - description: Conversation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Message content
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_application_dto_request.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerSendMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a message
      tags:
      - conversations
  /v1/tools:
    get:
      description: Returns the list of tools the authenticated token is allowed to
        use
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerToolsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: List available tools
      tags:
      - tools
  /v1/tools/batch:
    post:
      consumes:
      - application/json
      description: Executes multiple tool calls concurrently and returns all results
      parameters:
      - description: Array of tool calls
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_pkg_toolspec.ToolCall'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerBatchResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_wyuneed_go-agent-api_internal_pkg_response.SwaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: Execute tools in parallel
      tags:
      - tools
  /v1/tools/execute:
    post:
      consumes:
      - application/json
      description: Executes a single tool call and returns the result
      parameters:
      - description: Tool call
        in: body
        name: body
