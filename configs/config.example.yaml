server:
  port: 8080
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: aiagent
  ssl_mode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: change-me-in-production
  access_ttl: 15m
  refresh_ttl: 168h

llm:
  provider: litellm
  base_url: http://localhost:4000
  api_key: ""
  default_model: gpt-4o-mini

tools:
  web_search_api_key: ""
  max_concurrent: 10
